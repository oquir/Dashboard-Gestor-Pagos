packages:
  - apps/*

# pnpm no ejecuta los scripts de instalación de una dependencia salvo que se los apruebe acá. Es
# una defensa contra el postinstall de un paquete comprometido, y por eso la lista se declara en el
# repo en vez de aprobarse a mano en cada máquina.
#
# - core-js solo imprime un mensaje de donaciones al instalarse; no necesita ejecutarse.
# - esbuild sí lo necesita: baja el binario de su plataforma al instalar y sin
#   eso no arranca. Entra por tsx, con el que FormMaker corre sus scripts de verificación.
allowBuilds:
  core-js: false
  esbuild: true

# No instalar versiones publicadas hace menos de 7 días (en minutos).
minimumReleaseAge: 10080

# Rechazar una versión con menos garantías de procedencia que las anteriores del paquete.
trustPolicy: no-downgrade
# Falso positivo: parche retroactivo de 2023, publicado sin procedencia después de versiones 7.x que sí la tenían.
trustPolicyExclude:
  - semver@6.3.1

# Cada app conserva su propio pnpm-lock.yaml, con las versiones exactas que tenía antes de unir los
# repositorios. Un lockfile compartido obligaría a resolver de nuevo las dependencias que las dos
# apps comparten con distinta versión interna.
sharedWorkspaceLockfile: false
